<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a3936">
  <meta name="description" content="A quiet paddle down an endless river.">
  <title>Riverlight — A quiet paddle</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./game.js"></script>
</head>
<body>
  <main class="riverlight-game" aria-label="Riverlight kayak game">
    <canvas tabindex="0" aria-label="River. Press the left or right arrow key, or tap a side of the river, to paddle."></canvas>
    <div class="grain" aria-hidden="true"></div>
    <header class="masthead"><span class="edition">RIVERLIGHT <span> / </span> FIELD NOTES</span></header>
    <section class="rl-intro" data-intro aria-labelledby="game-title">
      <p class="eyebrow">A QUIET PADDLE</p>
      <h1 id="game-title">Riverlight</h1>
      <button class="launch" type="button">Take to the river <span aria-hidden="true">↗</span></button>
    </section>
    <p class="render-status" data-render-status role="status"></p>
    <div class="rl-controls" aria-label="Paddle controls">
      <button type="button" data-left aria-label="Paddle on the left">←</button>
      <span>PADDLE</span>
      <button type="button" data-right aria-label="Paddle on the right">→</button>
    </div>
  </main>
</body>
</html>
