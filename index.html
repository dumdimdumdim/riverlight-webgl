<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a3936">
  <meta name="description" content="A quiet paddle down an endless river.">
  <title>Riverlight — A quiet paddle</title>
  <link rel="stylesheet" href="./style.css?v=dee13caeab4b">
  <script defer src="./game.js?v=979317591945"></script>
</head>
<body>
  <main class="riverlight-game" aria-label="Riverlight kayak game">
    <canvas tabindex="0" aria-label="River. Press the left or right arrow key, or tap a side of the river, to paddle."></canvas>
    <div class="grain" aria-hidden="true"></div>
    <section class="rl-intro" data-intro aria-label="Start Riverlight">
      <button type="button">Tap or click to start</button>
      <p>
        <span class="rl-keyboard-hint">Use the ← and → arrow keys to paddle.</span>
        <span class="rl-touch-hint">Tap left or right of the kayak to paddle.</span>
      </p>
    </section>
    <p class="render-status" data-render-status role="status"></p>
    <div class="rl-controls" aria-label="Paddle controls">
      <button type="button" data-left aria-label="Paddle on the left">←</button>
      <button type="button" data-right aria-label="Paddle on the right">→</button>
    </div>
    <a class="credit" href="https://kisleyko.com/">made by KK</a>
  </main>
</body>
</html>
